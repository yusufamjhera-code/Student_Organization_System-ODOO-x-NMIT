<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Task Board | Pass Track</title>
    <link rel="stylesheet" href="../lib/theme.css">
    <link rel="stylesheet" href="../lib/components.css">
    <link rel="stylesheet" href="board.css?v=3">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <header>
        <div class="header-left">
            <a href="../organizer/dashboard.html" class="back-link" title="Back to Dashboard">
                <i class="ph-bold ph-caret-left"></i>
            </a>
            <div class="event-title-meta">
                <h1>Task Board</h1>
                <small id="org-name-meta" class="event-meta-text">Loading...</small>
            </div>
        </div>
        <div class="header-buttons">
            <button id="add-task-btn" class="primary-btn">
                <i class="ph-bold ph-plus"></i> <span>Add Task</span>
            </button>
        </div>
    </header>

    <!-- Mobile Column Switcher -->
    <div class="kanban-mobile-tabs">
        <button class="mobile-tab-btn active" data-col="col-todo">
            To Do <span class="tab-badge" id="m-count-todo">0</span>
        </button>
        <button class="mobile-tab-btn" data-col="col-inprogress">
            In Progress <span class="tab-badge" id="m-count-inprogress">0</span>
        </button>
        <button class="mobile-tab-btn" data-col="col-done">
            Done <span class="tab-badge" id="m-count-done">0</span>
        </button>
    </div>

    <main class="container kanban-container">
        
        <div class="kanban-column active" id="col-todo">
            <div class="column-header">
                <div class="col-title-wrap">
                    <span class="col-dot todo"></span>
                    <h3>To Do</h3>
                </div>
                <span class="task-count" id="count-todo">0</span>
            </div>
            <div class="column-body" data-status="todo"></div>
        </div>

        <div class="kanban-column" id="col-inprogress">
            <div class="column-header">
                <div class="col-title-wrap">
                    <span class="col-dot inprogress"></span>
                    <h3>In Progress</h3>
                </div>
                <span class="task-count" id="count-inprogress">0</span>
            </div>
            <div class="column-body" data-status="inprogress"></div>
        </div>

        <div class="kanban-column" id="col-done">
            <div class="column-header">
                <div class="col-title-wrap">
                    <span class="col-dot done"></span>
                    <h3>Done</h3>
                </div>
                <span class="task-count" id="count-done">0</span>
            </div>
            <div class="column-body" data-status="done"></div>
        </div>

    </main>

    <!-- Task Modal -->
    <div id="task-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 540px;">
            <button class="close-modal" id="close-task-modal" aria-label="Close Modal">
                <i class="ph ph-x"></i>
            </button>
            <div class="modal-header">
                <div class="modal-avatar-glow">
                    <i class="ph-fill ph-check-square"></i>
                </div>
                <h3 id="task-modal-title">New Task</h3>
                <span class="modal-subtitle">Assign and track organization deliverables</span>
            </div>
            
            <form id="task-form">
                <div class="input-group">
                    <label for="task-title">Task Title *</label>
                    <input type="text" id="task-title" required placeholder="e.g. Order badges and custom lanyards" maxlength="120">
                </div>
                
                <div class="input-group">
                    <label for="task-desc">Description / Instructions</label>
                    <textarea id="task-desc" rows="3" placeholder="Additional context, links, or notes..."></textarea>
                </div>

                <div class="time-inputs-row">
                    <div class="input-group">
                        <label for="task-priority">Priority *</label>
                        <select id="task-priority" class="custom-select">
                            <option value="medium">Medium Priority</option>
                            <option value="high">High Priority</option>
                            <option value="urgent">Urgent</option>
                            <option value="low">Low Priority</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="task-status">Status *</label>
                        <select id="task-status" class="custom-select">
                            <option value="todo">To Do</option>
                            <option value="inprogress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                </div>

                <div class="time-inputs-row">
                    <div class="input-group">
                        <label for="task-assignee">Assignee (Name or Email)</label>
                        <input type="text" id="task-assignee" placeholder="e.g. Yash or yash@nmit.ac.in">
                    </div>
                    <div class="input-group">
                        <label for="task-due">Due Date</label>
                        <input type="date" id="task-due">
                    </div>
                </div>

                <div class="modal-actions" style="margin-top: 20px;">
                    <button type="button" class="danger-btn" id="delete-task-btn" style="display:none; margin-right:auto;">
                        <i class="ph-bold ph-trash"></i> Delete
                    </button>
                    <button type="button" class="secondary-btn" id="cancel-task-btn">Cancel</button>
                    <button type="submit" class="primary-btn" id="save-task-btn">
                        <i class="ph-bold ph-check"></i> <span>Save Task</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase and Dependencies -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="../lib/firebase-config.js"></script>
    <script src="board.js"></script>
</body>
</html>
