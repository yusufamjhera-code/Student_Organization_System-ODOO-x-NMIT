<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>View Tickets | Pass Track</title>
    <link rel="stylesheet" href="../organizer/manage-event.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="#" id="back-to-manage" class="back-link" title="Back to Event">
                <i class="ph-bold ph-caret-left"></i>
            </a>
            <div class="event-title-meta">
                <h1>Ticket Sales</h1>
                <small id="event-name-meta" class="event-meta-text">Loading...</small>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px;">
            <div class="stat-card" style="background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
                <div style="font-size: 0.85rem; color: var(--text-muted);">Total Revenue</div>
                <div style="font-size: 1.8rem; font-weight: bold; color: var(--success);" id="stat-revenue">₹0</div>
            </div>
            <div class="stat-card" style="background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
                <div style="font-size: 0.85rem; color: var(--text-muted);">Tickets Sold</div>
                <div style="font-size: 1.8rem; font-weight: bold;" id="stat-sold">0</div>
            </div>
        </div>

        <div class="card list-card" style="width: 100%;">
            <div class="list-sticky-header">
                <div class="list-header">
                    <h2>Purchased Tickets</h2>
                </div>
            </div>
            <div id="ticket-list" class="scrollable-list directory-list">
                <div class="empty-state">
                    <i class="ph-bold ph-spinner-gap spin"></i>
                    <p>Loading tickets...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="../lib/firebase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const auth = firebase.auth();
            const firestore = db;
            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('event');
            
            document.getElementById('back-to-manage').href = `../organizer/manage-event.html?id=${eventId}`;
            
            if (!eventId) return;

            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    window.location.href = '../auth/login.html';
                    return;
                }

                try {
                    const eventDoc = await firestore.collection('events').doc(eventId).get();
                    if (!eventDoc.exists) return;
                    
                    const eventData = eventDoc.data();
                    
                    // Verify user is the event organizer
                    if (eventData.organizerId !== user.uid) {
                        window.location.href = '../organizer/dashboard.html';
                        return;
                    }
                document.getElementById('event-name-meta').textContent = eventData.name;
                const tConfig = eventData.ticketConfig || {};

                // Get users for this event that have a ticketType
                firestore.collection('users')
                    .where('eventDocId', '==', eventId)
                    .onSnapshot(snap => {
                        const tickets = snap.docs.map(d => ({id: d.id, ...d.data()}))
                            .filter(t => t.ticketType); // only those with a ticketType (bought online)
                        
                        document.getElementById('stat-sold').textContent = tickets.length;
                        
                        let revenue = 0;
                        const listEl = document.getElementById('ticket-list');
                        listEl.innerHTML = '';
                        
                        if (tickets.length === 0) {
                            listEl.innerHTML = '<div class="empty-state"><p>No tickets sold yet.</p></div>';
                            return;
                        }

                        tickets.forEach(t => {
                            const price = t.ticketType === 'member' ? (tConfig.memberPrice || 0) : (tConfig.nonmemberPrice || 0);
                            revenue += price;
                            
                            const item = document.createElement('div');
                            item.className = 'list-item card';
                            item.style.display = 'flex';
                            item.style.justifyContent = 'space-between';
                            item.style.padding = '15px';
                            item.style.alignItems = 'center';
                            
                            item.innerHTML = `
                                <div>
                                    <div style="font-weight:bold;">${t.name}</div>
                                    <div style="font-size:0.8rem; color:var(--text-muted);">${t.contact}</div>
                                </div>
                                <div style="text-align:right;">
                                    <span class="badge" style="background:rgba(106,17,203,0.1); color:var(--primary); padding:4px 8px; border-radius:12px; font-size:0.8rem;">
                                        ${t.ticketType.toUpperCase()} (₹${price})
                                    </span>
                                </div>
                            `;
                            listEl.appendChild(item);
                        });
                        
                        document.getElementById('stat-revenue').textContent = `₹${revenue}`;
                    });

                } catch(err) {
                    console.error(err);
                }
            });
        });
    </script>
</body>
</html>
