<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notice Board | Pass Track</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="board.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- XSS Sanitization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body class="centered-layout" style="align-items: flex-start; padding-top: 50px;">
    
    <div class="board-container">
        <div class="board-header">
            <h1 id="org-name">Loading...</h1>
            <p>Official Announcements & Notices</p>
        </div>
        
        <div id="posts-container">
            <div id="loading-spinner" class="loading-state">
                <i class="ph-bold ph-spinner-gap spin"></i>
                <p>Loading notices...</p>
            </div>
        </div>
    </div>

    <!-- Firebase and Dependencies -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="../lib/firebase-config.js"></script>
    <script src="board.js"></script>
</body>
</html>
