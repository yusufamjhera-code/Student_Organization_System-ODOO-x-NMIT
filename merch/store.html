<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merch Store | Pass Track</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="store.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="store-layout">

    <div id="toast-container" class="toast-container"></div>

    <div style="max-width: 1200px; margin: 10px auto 0; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;">
        <a href="../index.html" class="secondary-btn" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #fff; font-size: 0.9rem; background: rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);">
            <i class="ph-bold ph-caret-left"></i> <span>Back to Home</span>
        </a>
    </div>

    <header class="store-header">
        <h1 id="org-name">Loading...</h1>
        <p>Official Merchandise Store</p>
    </header>
    
    <main class="store-container">
        <div id="loading-spinner" class="loading-state">
            <i class="ph-bold ph-spinner-gap spin"></i>
            <p>Loading store...</p>
        </div>

        <div id="products-grid" class="products-grid" style="display:none;">
            <!-- Products injected here -->
        </div>
    </main>

    <!-- Order Modal -->
    <div id="order-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px; background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:30px; position:relative; margin:auto;">
            <button class="close-modal" id="close-order-modal" style="position:absolute; top:15px; right:15px; background:transparent; border:none; color:white; font-size:1.5rem; cursor:pointer;">
                <i class="ph ph-x"></i>
            </button>
            <h2 id="order-modal-title" style="margin-top:0; color:white; font-size:1.5rem;">Buy Item</h2>
            <div id="order-product-name" style="color:var(--text-muted); margin-bottom:20px;"></div>
            
            <form id="order-form">
                <input type="hidden" id="order-product-id">
                
                <div class="input-group">
                    <label>Select Size *</label>
                    <select id="order-size" class="custom-select" required>
                        <option value="">Select a size...</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Quantity *</label>
                    <input type="number" id="order-quantity" value="1" min="1" max="10" required>
                    <small id="stock-warning" style="color:var(--danger); display:none;">Not enough stock!</small>
                </div>

                <div class="input-group">
                    <label>Full Name *</label>
                    <input type="text" id="buyer-name" required placeholder="John Doe">
                </div>
                
                <div class="input-group">
                    <label>Email Address *</label>
                    <input type="email" id="buyer-email" required placeholder="john@example.com">
                </div>

                <div id="member-verification-status" class="alert-box" style="display:none; padding:10px; border-radius:8px; margin-bottom:15px; font-size:0.9rem; align-items:center; gap:10px;"></div>

                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px dashed var(--border); padding-top:15px; margin-bottom:20px;">
                    <span style="color:var(--text-muted);">Total Amount:</span>
                    <strong id="order-total" style="font-size:1.5rem; color:var(--primary);">₹0</strong>
                </div>

                <button type="submit" class="primary-btn full-width" id="checkout-btn" style="width:100%; justify-content:center;">
                    <i class="ph-bold ph-credit-card"></i> <span>Place Order</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Success State -->
    <div id="success-state" class="card success-card" style="display: none; max-width: 500px; margin: 40px auto; text-align: center; padding: 40px;">
        <div class="success-icon" style="font-size:4rem; color:var(--success); margin-bottom:20px;">
            <i class="ph-fill ph-check-circle"></i>
        </div>
        <h2 style="margin-bottom:10px;">Order Placed Successfully!</h2>
        <p style="color:var(--text-muted); margin-bottom:30px;">Your order has been recorded. Please complete payment and collect your merchandise at the venue.</p>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <a href="javascript:location.reload()" class="secondary-btn">Continue Shopping</a>
            <a href="../index.html" class="secondary-btn" style="background:var(--primary, #6a11cb); color:#fff;">← Back to Home</a>
        </div>
    </div>

    <!-- Firebase and Dependencies -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="../lib/firebase-config.js"></script>
    <script src="store.js"></script>
</body>
</html>
