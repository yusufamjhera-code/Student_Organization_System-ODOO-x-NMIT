<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../lib/theme.css">
    <link rel="stylesheet" href="../lib/components.css">
    <link rel="stylesheet" href="scanner.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="scanner-wrapper">
        <header>
            <div class="header-info">
                <h1>Staff Scanner</h1>
                <!-- Synchronized with activeStationEl in Canvas -->
                <small id="active-station-name">Station: Not Selected</small>
            </div>
            <div class="header-buttons">
                <!-- Voice Soundbox Toggle Button -->
                <button id="soundbox-toggle-btn" class="header-btn soundbox-btn" aria-label="Toggle Voice Soundbox" title="Toggle Hardware Voice Soundbox">
                    <i class="ph-bold ph-speaker-high" id="soundbox-icon"></i>
                    <span id="soundbox-status-label">Voice: ON</span>
                </button>
                <!-- Camera Switch Button -->
                <button id="change-camera-btn" class="header-btn camera-btn" aria-label="Switch Camera">
                    <i class="ph-bold ph-camera-rotate"></i>
                    <span>Switch</span>
                </button>
                <a href="../treasury/reimbursements.html" class="header-btn" title="Submit Volunteer Reimbursement" style="text-decoration:none; display:inline-flex; align-items:center; gap:5px;">
                    <i class="ph-bold ph-receipt"></i>
                    <span>Claim Expense</span>
                </a>
                <!-- Logout Button -->
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>
        </header>

        <main class="container">
            <!-- STATION SELECTOR: Blocks usage until a station is picked (Canvas logic) -->
            <div id="station-selection-overlay" class="station-overlay">
                <div class="station-card">
                    <h3>Select Scan Point</h3>
                    <p>Which station are you currently managing?</p>
                    <div id="station-options" class="station-grid">
                        <!-- Stations injected dynamically via loadStations() in Canvas -->
                        <p style="color:gray; padding: 20px;">Fetching assigned stations...</p>
                    </div>
                </div>
            </div>

            <!-- Scanner Viewport -->
            <div class="scanner-container">
                <!-- Synchronized with html5QrCode in Canvas -->
                <div id="reader"></div>
                
                <!-- Visual Scanning Frame -->
                <div class="scan-frame">
                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>
                </div>
            </div>

            <!-- Feedback UI: Synchronized with showResult() in Canvas -->
            <div id="result-container">
                <div id="result-icon">📷</div>
                <div id="result-text">
                    <strong>Initializing...</strong><br>
                    Please wait for camera access.
                </div>
            </div>
            
            <!-- Voice Soundbox Hardware Simulator Bar -->
            <div class="soundbox-demo-panel" id="soundbox-demo-panel">
                <div class="soundbox-panel-header">
                    <i class="ph-fill ph-broadcast"></i>
                    <span>Hardware Event Soundbox Simulator</span>
                </div>
                <div class="soundbox-quick-triggers">
                    <button type="button" class="btn-soundbox-trigger grant" id="test-grant-btn">
                        <i class="ph-bold ph-speaker-high"></i> <span>"Access Granted"</span>
                    </button>
                    <button type="button" class="btn-soundbox-trigger warn" id="test-warning-btn">
                        <i class="ph-bold ph-warning"></i> <span>"Already Used"</span>
                    </button>
                    <button type="button" class="btn-soundbox-trigger deny" id="test-denied-btn">
                        <i class="ph-bold ph-x-circle"></i> <span>"Invalid Pass"</span>
                    </button>
                </div>
            </div>

            <!-- Change Station Trigger: Synchronized with switchStationBtn in Canvas -->
            <button id="switch-station-btn" class="secondary-action-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256">
                    <path d="M222,128a94,94,0,1,1-94-94,94.1,94.1,0,0,1,94,94Z" opacity="0.2"></path>
                    <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm45.66-93.66a8,8,0,0,1,0,11.32l-32,32a8,8,0,0,1-11.32-11.32L144.69,136H88a8,8,0,0,1,0-16h56.69l-14.35-14.34a8,8,0,0,1,11.32-11.32Z"></path>
                </svg>
                Switch Station
            </button>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="../lib/firebase-config.js"></script>
    <script src="scanner.js"></script>
</body>
</html>
