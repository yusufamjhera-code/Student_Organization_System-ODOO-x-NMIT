<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributor Portal | Pass Track</title>
    <!-- Linked to distributor.css for a cohesive staff experience -->
    <link rel="stylesheet" href="distributor.css">
    <!-- Phosphor Icons for a consistent UI language -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="login-wrapper">
        <div class="form-container">
            <!-- Branding Header -->
            <div class="login-header">
                <div class="icon-circle">
                    <i class="ph-fill ph-shield-checkered"></i>
                </div>
                <h2>Staff Authorization</h2>
                <p class="subtitle">Enter the Event ID and Staff Key provided by your organizer to access the scanner.</p>
            </div>

            <!-- Login Form -->
            <form id="distributor-login-form">
                <div class="input-group">
                    <label for="event-id">Event Identification</label>
                    <div class="input-with-icon">
                        <i class="ph ph-hash"></i>
                        <input type="text" id="event-id" name="eventId" placeholder="e.g., techfest2026" required autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="distributor-code">Staff Access Key</label>
                    <div class="input-with-icon">
                        <i class="ph ph-key"></i>
                        <input type="password" id="distributor-code" name="distributorCode" placeholder="Enter your secret key" required>
                        <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Toggle password visibility">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <span>Access Scanner</span>
                    <i class="ph-bold ph-arrow-right"></i>
                </button>
            </form>

            <!-- Feedback Message Area -->
            <div id="message" class="message-area"></div>

            <!-- Footer Navigation -->
            <div class="login-footer">
                <a href="../index.html" class="back-link">
                    <i class="ph ph-caret-left"></i>
                    Back to Selection
                </a>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & App Logic -->
    <!-- compat mode for consistency with existing project scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="../lib/firebase-config.js"></script>
    <script src="distributor.js"></script>
</body>
</html>
