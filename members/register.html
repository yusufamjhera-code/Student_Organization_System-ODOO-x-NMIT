<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Join Organization | Pass Track</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../lib/upi-gateway.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-placeholder">
                    <i class="ph-bold ph-users-three"></i>
                </div>
                <h1 id="org-name-header">Loading...</h1>
                <p id="org-desc">Become a member today.</p>
            </div>

            <!-- Single Clean Back Navigation -->
            <div style="margin-bottom: 20px;">
                <a href="../index.html" class="back-nav-btn" id="nav-back-home">
                    <i class="ph-bold ph-caret-left"></i> <span>Back to Home</span>
                </a>
            </div>

            <!-- Tabs: Register vs Pay Dues / Status -->
            <div class="tabs-container">
                <button type="button" id="tab-register-btn" class="tab-btn active">
                    <i class="ph-bold ph-user-plus"></i> Join as Member
                </button>
                <button type="button" id="tab-dues-btn" class="tab-btn">
                    <i class="ph-bold ph-credit-card"></i> Pay Dues / Status
                </button>
            </div>

            <div id="loading-spinner" class="loading-spinner">
                <i class="ph-bold ph-spinner-gap spin"></i>
                <p>Fetching organization details...</p>
            </div>

            <div id="error-message" class="message-area error" style="display: none;"></div>
            <div id="success-message" class="message-area success" style="display: none;"></div>

            <!-- Panel 1: Registration Form -->
            <form id="register-form" style="display: none;">
                <div class="input-group">
                    <label for="member-name">Full Name *</label>
                    <input type="text" id="member-name" placeholder="e.g. John Doe" required minlength="2" maxlength="100">
                </div>

                <div class="input-group">
                    <label for="member-email">Email Address *</label>
                    <input type="email" id="member-email" placeholder="john@example.com" required maxlength="120">
                    <small class="feedback-text">Must be unique for this organization</small>
                </div>

                <div class="input-group">
                    <label for="member-phone">Phone Number *</label>
                    <input type="tel" id="member-phone" placeholder="e.g. 9876543210" required minlength="10" maxlength="15">
                    <small class="feedback-text">10-digit mobile number for membership records</small>
                </div>

                <div class="input-group">
                    <label for="member-studentid">Student ID / Roll No</label>
                    <input type="text" id="member-studentid" placeholder="e.g. 1NT22CS001" maxlength="30">
                </div>

                <div class="dues-info-box" id="dues-info-box">
                    <strong>Membership Fee: <span id="fee-amount">₹0</span></strong>
                    <p>Membership valid for <span id="duration-days">365</span> days.</p>
                </div>

                <button type="submit" id="submit-btn" class="primary-btn full-width">
                    <i class="ph-bold ph-user-plus"></i>
                    <span>Register Now</span>
                </button>
            </form>

            <!-- Panel 2: Pay Dues / Check Status -->
            <div id="dues-panel" style="display: none;">
                <div class="input-group">
                    <label for="check-dues-email">Registered Email Address</label>
                    <input type="email" id="check-dues-email" placeholder="john@example.com" maxlength="120">
                </div>

                <button type="button" id="check-dues-btn" class="primary-btn full-width" style="margin-bottom: 20px;">
                    <i class="ph-bold ph-magnifying-glass"></i>
                    <span>Check Membership & Dues</span>
                </button>

                <div id="dues-result" style="display: none;"></div>
            </div>
        </div>
    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="../lib/firebase-config.js"></script>
    <script src="../lib/contracts/passtrack-core.js"></script>
    <script src="../lib/toast.js"></script>
    <script src="../lib/upi-gateway.js"></script>
    <script src="register.js"></script>
</body>
</html>
