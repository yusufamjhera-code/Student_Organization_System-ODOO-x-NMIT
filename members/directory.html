<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Member Directory | Pass Track</title>
    <link rel="stylesheet" href="directory.css?v=4">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div id="toast-container" class="toast-container"></div>

    <header>
        <div class="header-left">
            <a href="../organizer/dashboard.html" id="back-to-dashboard" class="back-link" title="Back to Dashboard">
                <i class="ph-bold ph-caret-left"></i>
            </a>
            <div class="event-title-meta">
                <h1>Member Directory</h1>
                <small id="org-name-meta" class="event-meta-text">Loading...</small>
            </div>
        </div>
        <div class="header-buttons">
            <button id="add-member-btn" class="primary-btn">
                <i class="ph-bold ph-user-plus"></i> <span>Add Member</span>
            </button>
            <button id="share-reg-btn" class="secondary-btn" title="Copy public registration link">
                <i class="ph-bold ph-share-network"></i> <span>Share Link</span>
            </button>
            <button id="logout-btn" class="logout-btn icon-only-mobile">
                <i class="ph-bold ph-sign-out"></i> <span>Logout</span>
            </button>
        </div>
    </header>

    <main class="container">
        
        <!-- TOP ROW: Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="ph-bold ph-users"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-total">0</span>
                    <span class="stat-label">Total Members</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon success"><i class="ph-bold ph-check-circle"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-active">0</span>
                    <span class="stat-label">Active</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning"><i class="ph-bold ph-hourglass-high"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-pending">0</span>
                    <span class="stat-label">Pending Dues</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon danger"><i class="ph-bold ph-x-circle"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="stat-expired">0</span>
                    <span class="stat-label">Expired</span>
                </div>
            </div>
        </div>

        <div class="main-content-full">
            <div class="card list-card">
                <div class="list-sticky-header">
                    <div class="list-header">
                        <div class="header-main">
                            <div class="search-wrapper">
                                <i class="ph ph-magnifying-glass"></i>
                                <input type="text" id="member-search" placeholder="Search name, email, or Student ID...">
                            </div>
                            
                            <div class="filters-group">
                                <select id="filter-status" class="custom-select">
                                    <option value="all">All Statuses</option>
                                    <option value="active">Active</option>
                                    <option value="pending">Pending Dues</option>
                                    <option value="expired">Expired</option>
                                </select>
                                <select id="sort-dropdown" class="custom-select">
                                    <option value="newest">Newest First</option>
                                    <option value="alpha">A - Z (Name)</option>
                                    <option value="expiring">Expiring Soon</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="selection-header">
                        <label class="checkbox-container item-checkbox">
                            <input type="checkbox" id="select-all-members">
                            <div class="checkbox-box"></div>
                            <span>Select All</span>
                        </label>
                        <button id="remind-expiring-btn" class="secondary-btn small-btn">
                            <i class="ph-bold ph-bell-ringing"></i> Remind Expiring Soon
                        </button>
                    </div>

                    <div class="table-columns-bar">
                        <span class="col-head col-select"></span>
                        <span class="col-head col-avatar"></span>
                        <span class="col-head col-member">MEMBER</span>
                        <span class="col-head col-id">STUDENT ID</span>
                        <span class="col-head col-exp">EXPIRATION</span>
                        <span class="col-head col-status">STATUS</span>
                        <span class="col-head col-dues">DUES PAID</span>
                        <span class="col-head col-actions"></span>
                    </div>
                </div>

                <div id="member-list" class="scrollable-list directory-list">
                    <div class="empty-state">
                        <i class="ph-bold ph-spinner-gap spin"></i>
                        <p>Loading members...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Bulk Action Island -->
    <div id="bulk-actions-bar" class="bulk-floating-island hidden">
        <div class="bulk-content">
            <button id="bulk-remind-btn" class="bulk-btn email">
                <i class="ph-bold ph-bell"></i> 
                <span id="bulk-remind-text">Send Reminders</span>
            </button>
            <div class="bulk-divider"></div>
            <button id="bulk-delete-btn" class="bulk-btn delete">
                <i class="ph-bold ph-trash"></i> <span>Delete</span>
            </button>
        </div>
    </div>

    <!-- Add Member Modal -->
    <div id="add-member-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 520px;">
            <button class="close-modal" id="close-add-member-modal" aria-label="Close Modal">
                <i class="ph ph-x"></i>
            </button>
            <div class="modal-header">
                <div class="modal-avatar-glow">
                    <i class="ph-fill ph-user-plus"></i>
                </div>
                <h3>Add New Member</h3>
                <span class="modal-subtitle">Register a member to your organization</span>
            </div>

            <form id="add-member-form">
                <div class="input-group">
                    <label for="new-member-name">Full Name *</label>
                    <input type="text" id="new-member-name" required placeholder="e.g. Rahul Sharma" autocomplete="name">
                </div>

                <div class="time-inputs-row">
                    <div class="input-group">
                        <label for="new-member-email">Email Address *</label>
                        <input type="email" id="new-member-email" required placeholder="rahul@example.com" autocomplete="email">
                    </div>
                    <div class="input-group">
                        <label for="new-member-phone">Phone Number (10 digits) *</label>
                        <input type="tel" id="new-member-phone" required placeholder="9876543210" maxlength="15" autocomplete="tel">
                    </div>
                </div>

                <div class="time-inputs-row">
                    <div class="input-group">
                        <label for="new-member-studentid">Student ID / Roll No *</label>
                        <input type="text" id="new-member-studentid" required placeholder="e.g. 1NT21CS001">
                    </div>
                    <div class="input-group">
                        <label for="new-member-plan">Membership Validity *</label>
                        <select id="new-member-plan" class="custom-select">
                            <option value="12">1 Year (12 Months)</option>
                            <option value="6">6 Months</option>
                            <option value="24">2 Years</option>
                            <option value="36">3 Years</option>
                        </select>
                    </div>
                </div>

                <div class="time-inputs-row">
                    <div class="input-group">
                        <label for="new-member-dues">Dues Amount (₹) *</label>
                        <input type="number" id="new-member-dues" min="0" step="1" value="500" required>
                    </div>
                    <div class="input-group" style="justify-content: flex-end; padding-bottom: 8px;">
                        <label style="margin-bottom: 8px;">Payment Status</label>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <label class="toggle-switch">
                                <input type="checkbox" id="new-member-paid" checked>
                                <span class="toggle-slider"></span>
                            </label>
                            <span id="new-member-paid-label" style="font-size: 0.85rem; font-weight: 600; color: var(--success);">Paid</span>
                        </div>
                    </div>
                </div>

                <div class="modal-actions" style="margin-top: 20px;">
                    <button type="button" class="secondary-btn" id="cancel-add-member-btn">Cancel</button>
                    <button type="submit" class="primary-btn" id="save-new-member-btn">
                        <i class="ph-bold ph-check"></i> <span>Add Member</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Member Detail / Edit Modal -->
    <div id="member-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 520px;">
            <button class="close-modal" id="close-member-modal" aria-label="Close Modal">
                <i class="ph ph-x"></i>
            </button>

            <div class="modal-header">
                <div class="modal-avatar-glow">
                    <i class="ph-fill ph-user-circle"></i>
                </div>
                <h3 id="modal-member-name">Member Name</h3>
                <span id="modal-member-status" class="modal-subtitle badge">Status</span>
            </div>

            <form id="edit-member-form">
                <div class="input-group">
                    <label for="edit-member-name">Full Name *</label>
                    <input type="text" id="edit-member-name" required placeholder="Full Name">
                </div>

                <div class="time-inputs-row">
                    <div class="input-group">
                        <label for="edit-member-email">Email Address *</label>
                        <input type="email" id="edit-member-email" required placeholder="email@example.com">
                    </div>
                    <div class="input-group">
                        <label for="edit-member-phone">Phone Number *</label>
                        <input type="tel" id="edit-member-phone" required placeholder="Phone Number">
                    </div>
                </div>

                <div class="time-inputs-row">
                    <div class="input-group">
                        <label for="edit-member-studentid">Student ID *</label>
                        <input type="text" id="edit-member-studentid" required placeholder="Student ID">
                    </div>
                    <div class="input-group">
                        <label for="edit-member-enddate">Membership Expiry *</label>
                        <input type="date" id="edit-member-enddate" required>
                    </div>
                </div>

                <hr class="modal-divider" style="margin: 15px 0; border: none; border-top: 1px solid var(--border);">

                <div class="dues-section">
                    <h4>Membership & Dues</h4>
                    <div class="dues-status-box">
                        <div class="dues-info">
                            <span class="dues-amount" id="modal-dues-amount">₹0</span>
                            <span class="dues-period" id="modal-dues-period">Valid till: --</span>
                        </div>
                        <div class="dues-action">
                            <label class="toggle-switch">
                                <input type="checkbox" id="modal-dues-toggle">
                                <span class="toggle-slider"></span>
                            </label>
                            <span id="modal-dues-label" class="toggle-label">Mark as Paid</span>
                        </div>
                    </div>
                </div>
                
                <div class="modal-actions" style="margin-top: 20px; display: flex; gap: 10px; justify-content: space-between;">
                    <button type="button" class="danger-btn" id="modal-delete-btn" style="margin-right: auto;">
                        <i class="ph-bold ph-trash"></i> Delete
                    </button>
                    <button type="button" class="secondary-btn" id="cancel-edit-member-btn">Cancel</button>
                    <button type="submit" class="primary-btn" id="save-edit-member-btn">
                        <i class="ph-bold ph-check"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase and Dependencies -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="../lib/firebase-config.js"></script>
    <script src="directory.js"></script>
</body>
</html>
